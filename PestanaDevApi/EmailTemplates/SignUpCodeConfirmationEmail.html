<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Template</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
        }

        table {
            border-spacing: 0;
        }

        td {
            padding: 0;
        }

        img {
            border: 0;
        }

        .content {
            width: 100%;
            max-width: 600px;
            color: #000000;
            margin: 0 auto;
            margin-top: 5%;
            border-radius: 8px;
            overflow: hidden;
            background-color: #F5F5F7;
        }

        .header {
            background-color: #38b6ff;
            padding: 40px;
            text-align: center;
            color: #ffffff;
        }

        .body-content {
            padding: 40px;
            color: #000000;
            line-height: 1.6;
        }

        .footer {
            background-color: #D3D3D3;
            padding: 20px;
            text-align: center;
            color: #000000;
            font-size: 12px;
            margin-top: 200px;
        }

        .codesDivWrapper {
            text-align: center;
        }

        .codeSpan {
            display: inline-block;
            padding: 16px;
            border: 2px solid black;
            font-size: 14px;
            border-radius: 5px;
        }

        .title {
            margin: 0;
            font-size: 24px;
            padding: 20px;
        }

        .paragraph {
            font-size: 18px;
            padding: 20px;
        }

        .codeTdPadding {
            padding: 5px;
        }
    </style>
</head>
<body>
    <center>
        <table role="presentation" align="center" cellpadding="0" cellspacing="0">
            <tr>
                <td class="header">
                    <h1 class="title">{{Title}}</h1>
                </td>
            </tr>
            <tr>
                <td align="center">
                    <p class="paragraph">{{Paragraph}}</p>
                    <br>
                </td>
            </tr>

            <tr>
                <td align="center">
                    <table role="presentation" cellpadding="0" cellspacing="0">
                        <tr class="codeRow">
                            <td class="codeTdPadding">
                                <span class="codeSpan">
                                    {{CodeOne}}
                                </span>
                            </td>
                            <td class="codeTdPadding">
                                <span class="codeSpan">
                                    {{CodeTwo}}
                                </span>
                            </td>
                            <td class="codeTdPadding">
                                <span class="codeSpan">
                                    {{CodeThree}}
                                </span>
                            </td>
                            <td class="codeTdPadding">
                                <span class="codeSpan">
                                    {{CodeFour}}
                                </span>
                            </td>
                            <td class="codeTdPadding">
                                <span class="codeSpan">
                                    {{CodeFive}}
                                </span>
                            </td>
                            <td class="codeTdPadding">
                                <span class="codeSpan">
                                    {{CodeSix}}
                                </span>
                            </td>
                            <td class="codeTdPadding">
                                <span class="codeSpan">
                                    {{CodeSeven}}
                                </span>
                            </td>
                            <td class="codeTdPadding">
                                <span class="codeSpan">
                                    {{CodeEight}}
                                </span>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

            <tr>
                <td height="60"></td>
            </tr>

            <tr>
                <td class="footer">
                    <p style="margin: 0;">&copy; {{Copyright}}</p>
                    <p style="margin: 5px 0 0 0;">{{Subcopyright}}</p>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
